name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "FEATURE/**"
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "20"
  MONGODB_VERSION: "7.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            Server/package-lock.json
            DyFolio-Front/package-lock.json

      - name: Install Server dependencies
        working-directory: Server
        run: npm ci --prefer-offline --no-audit

      - name: Check TypeScript compilation
        working-directory: Server
        run: npm run build

      - name: Install Frontend dependencies
        working-directory: DyFolio-Front
        run: npm ci --prefer-offline --no-audit

      - name: Run frontend ESLint
        working-directory: DyFolio-Front
        run: npm run lint
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Server/package-lock.json

      - name: Install Server dependencies
        working-directory: Server
        run: npm ci --prefer-offline --no-audit

      - name: Run tests with coverage
        working-directory: Server
        run: npm test -- --ci --maxWorkers=2
        env:
          MONGODB_URI: mongodb://localhost:27017/dyfolio-test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./Server/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Server/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fix index.html if directory
        run: |
          if [ -d "DyFolio-Front/index.html" ]; then
            echo "Fixing index.html directory issue"
            rm -rf DyFolio-Front/index.html
            git checkout HEAD -- DyFolio-Front/index.html
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            Server/package-lock.json
            DyFolio-Front/package-lock.json

      - name: Install Server dependencies
        working-directory: Server
        run: npm ci --prefer-offline --no-audit

      - name: Build Server
        working-directory: Server
        run: npm run build

      - name: Verify Server build
        working-directory: Server
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: Server build failed"
            exit 1
          fi
          echo "Server build successful"

      - name: Archive server build
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: Server/dist/
          retention-days: 7

      - name: Install Frontend dependencies
        working-directory: DyFolio-Front
        run: npm ci --prefer-offline --no-audit

      - name: Verify Frontend files
        working-directory: DyFolio-Front
        run: |
          echo "Checking project structure..."
          ls -la
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found"
            exit 1
          fi
          if [ ! -f "vite.config.js" ]; then
            echo "Error: vite.config.js not found"
            exit 1
          fi
          echo "All required files present"

      - name: Build Frontend
        working-directory: DyFolio-Front
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Frontend build
        working-directory: DyFolio-Front
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: Frontend build failed"
            exit 1
          fi
          echo "Frontend build successful"
          ls -la dist/

      - name: Archive frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: DyFolio-Front/dist/
          retention-days: 7

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/dyfolio-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          file: ./Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/dyfolio-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/dyfolio-api:buildcache,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            Server/package-lock.json
            DyFolio-Front/package-lock.json

      - name: Install Server dependencies
        working-directory: Server
        run: npm ci --prefer-offline --no-audit

      - name: Run npm audit (Server)
        working-directory: Server
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install Frontend dependencies
        working-directory: DyFolio-Front
        run: npm ci --prefer-offline --no-audit

      - name: Run npm audit (Frontend)
        working-directory: DyFolio-Front
        run: npm audit --audit-level=high
        continue-on-error: true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()

    steps:
      - name: Check job status
        id: check
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Pipeline summary
        run: |
          echo "### Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY

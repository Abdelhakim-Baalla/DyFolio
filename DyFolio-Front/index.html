<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/DyFolio-icon.png" />
    <link rel="apple-touch-icon" href="/DyFolio-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DyFolio — Portfolio dynamique</title>
    <meta
      name="description"
      content="DyFolio — Portfolio dynamique présentant projets, compétences et expériences. Développé avec React et Vite."
    />
    <meta
      name="keywords"
      content="portfolio, développeur, projets, compétences, React, Vite"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="DyFolio — Portfolio dynamique" />
    <meta
      property="og:description"
      content="Portfolio présentant projets, compétences et expériences. Développé avec React et Vite."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/DyFolio-icon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DyFolio — Portfolio dynamique" />
    <meta
      name="twitter:description"
      content="Portfolio présentant projets, compétences et expériences. Développé avec React et Vite."
    />
    <meta name="twitter:image" content="/DyFolio-icon.png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0ea5a4" />
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Favicon & platform shortcuts -->
    <link rel="shortcut icon" href="/DyFolio-icon.png" />
    <link rel="icon" href="/DyFolio-icon.png" sizes="192x192" />
    <!-- Safari pinned tab (uses an SVG ideal; using PNG as fallback) -->
    <link rel="mask-icon" href="/DyFolio-icon.png" color="#0ea5a4" />

    <!-- Microsoft / Windows tile -->
    <meta name="msapplication-TileColor" content="#0ea5a4" />
    <meta name="msapplication-TileImage" content="/DyFolio-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DyFolio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Minimal structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DyFolio",
        "url": "/",
        "description": "Portfolio présentant projets, compétences et expériences."
      }
    </script>
    <!-- Font Awesome now imported via npm in src/main.jsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
